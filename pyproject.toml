[project]
name = "md2short"
version = "0.1.0"
description = "Markdown 1개를 한국어 9:16 숏폼 MP4로 변환하는 로컬 CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
md2short = "md2short.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["md2short"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: needs ffmpeg, Chrome Headless Shell and remotion/node_modules",
    "live: calls real external APIs, needs .env keys",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["remotion"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "pathlib.Path"]
